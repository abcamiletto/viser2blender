name: Release

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Detect release state
        id: version
        env:
          PACKAGE_NAME: viser2blender
        run: |
          version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          git fetch --tags --force
          needs_tag=true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            needs_tag=false
          fi
          echo "needs_tag=$needs_tag" >> "$GITHUB_OUTPUT"

          pypi_url="https://pypi.org/pypi/${PACKAGE_NAME}/json"
          status_code="$(curl -LsS -o pypi.json -w '%{http_code}' "$pypi_url")"
          needs_publish=true
          if [ "$status_code" = "200" ] && python - "$version" <<'PY'
          import json
          import sys

          version = sys.argv[1]
          with open("pypi.json", "r", encoding="utf-8") as f:
              releases = json.load(f)["releases"]

          raise SystemExit(0 if version in releases else 1)
          PY
          then
            needs_publish=false
          fi
          echo "needs_publish=$needs_publish" >> "$GITHUB_OUTPUT"

          needs_release=false
          if [ "$needs_tag" = "true" ] || [ "$needs_publish" = "true" ]; then
            needs_release=true
          fi
          echo "needs_release=$needs_release" >> "$GITHUB_OUTPUT"
      - name: Push tag
        if: steps.version.outputs.needs_tag == 'true'
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Build
        if: steps.version.outputs.needs_release == 'true'
        run: uv build
      - name: Publish to PyPI
        if: steps.version.outputs.needs_publish == 'true'
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            uv publish --token "$PYPI_API_TOKEN"
          else
            uv publish
          fi
      - name: Create GitHub release
        if: steps.version.outputs.needs_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
